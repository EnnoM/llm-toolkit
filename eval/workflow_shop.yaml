# Shop-Datenbank des erfundenen Shops „Larkfield“ für das Modul „Workflow mit Freigabe“.
#
# Bevor das Modell eine Antwort entwirft, sucht core/workflow.py hier alles zur Mail heraus:
# Kunde und Bestellungen zum Absender, Bestellnummern aus dem Text, erwähnte Produkte und die
# Shop-Regeln. Das Modell darf nur diese Fakten verwenden.
#
# Die Daten passen zu eval/workflow_mails.yaml (Posteingang vom Montag, 26.10.2026). Manche
# Fälle lösen die Daten eindeutig, andere nicht; welche, steht in den Mails unter
# expected.assessment. Alle Personen, Bestellungen und Firmen sind erfunden.

today: 2026-10-26

policies:
  returns: >-
    Returns are accepted within 30 days of delivery if the item is unused and in its original
    packaging. The customer gets a free return label by email. The refund goes to the original
    payment method within 5 business days after the return has arrived and passed inspection.
  damaged_goods: >-
    Goods damaged on arrival: we send a free replacement by express within 1 business day, or
    give a full refund if the customer prefers. The damaged item does not need to be returned.
  delivery: >-
    Standard delivery with DHL takes 2 to 4 business days. If tracking shows no update for 5
    business days, customer service opens a carrier investigation.
  missing_parcels: >-
    If tracking says delivered but the customer has not received the parcel, we ask the customer
    to check with neighbours and at the drop-off place, and open a claim with the carrier. A
    replacement or refund before the claim is decided (up to 10 business days) needs a team
    lead's approval.
  payments: >-
    A second charge of the same amount right after an order is usually a card authorization
    hold. The bank releases it automatically within 5 business days; customer service cannot
    release it earlier.
  business_orders: >-
    Orders of 20 units or more get an individual quote from the sales team
    (sales@larkfield.example) within 2 business days. Invoices to companies are possible.
  packaging: >-
    From 1 November 2026 on, all parcels will be packed with recycled paper instead of plastic
    air cushions. Customer feedback about packaging is welcome and needs no further action.

