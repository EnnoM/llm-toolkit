    normal wie m04

- id: m14
  sender: "Paul Fischer <paul.fischer@example.com>"
  received: 2026-10-26 09:38
  subject: Tracking says delivered, but nothing is here
  body: |
    Hello,

    the tracking for my order 40477 (Bluetooth speaker) says it was delivered on Saturday afternoon. I was at home all day and there was nothing at my door. My neighbours don't have it either. Can you please check this?

    Paul Fischer
  expected: {category: order_status, priority: high, assessment: unclear}
  why: Laut Daten zugestellt, laut Kunde nicht angekommen. Die Daten entscheiden den Fall
    nicht; Ersatz vor Abschluss der Reklamation braucht laut Regel eine Freigabe
