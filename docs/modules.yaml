# Arbeits-Checkliste des Projekts. Die Startseite (app_pages/home.py) zeigt diese Datei an.
# Nach einer Änderung auf der Startseite über der Tabelle auf „Neu laden“ klicken.
#
# Felder pro Modul (alle Pflicht):
#   id, name, phase (1-6), status, kurz (ein Satz für die Tabelle),
#   beschreibung, oberflaeche, lernziele (3-5 Punkte), akzeptanz (3-5 Punkte),
#   arbeitsstand, naechster_schritt, notizen (darf leer sein: "")
#
# Regeln für arbeitsstand und naechster_schritt (prüft tests/test_modules.py):
#   status: geplant    -> arbeitsstand und naechster_schritt sind "noch nicht begonnen"
#   status: in_arbeit  -> arbeitsstand beschreibt, was schon läuft und wo du stehengeblieben
#                         bist; naechster_schritt ist genau eine konkrete Aufgabe (eine Zeile)
#   status: fertig     -> arbeitsstand ist "abgeschlossen", naechster_schritt ist "-"
#   notizen: offene Fragen, Stolpersteine, nützliche Links
#
# Texte werden als Markdown angezeigt. Kein Dollarzeichen verwenden (Streamlit liest es als
# Formel), Beträge als "USD" oder "Euro" schreiben.

# ---------------------------------------------------------------- Phase 2: Grundlagen

- id: chat
  name: Chat
  phase: 2
  status: in_arbeit
  kurz: "Chatfenster mit gestreamten Antworten, einstellbarem System-Prompt und Anzeige von Tokens und Kosten."
  beschreibung: |
    Ein Chatfenster wie bei ChatGPT, nur mit Blick unter die Haube: Jede Nachricht geht über
    OpenRouter an ein LLM (Large Language Model, ein Sprachmodell, das Text Stück für Stück
    fortsetzt). Die Antwort wird gestreamt, das heißt, sie erscheint Wort für Wort, statt erst
    nach einigen Sekunden komplett.

    Über einen System-Prompt, eine für Nutzer unsichtbare Anweisung vor dem Gespräch, lassen
    sich Rolle, Ton und Regeln festlegen. Das Modell selbst hat kein Gedächtnis: Bei jeder
    Anfrage wird der komplette bisherige Verlauf erneut mitgeschickt, begrenzt durch das
    Kontextfenster, also die maximale Textmenge, die ein Modell auf einmal verarbeiten kann.

    Abgerechnet wird in Tokens, den Textstücken, in denen Modelle rechnen (oft eine Silbe oder
    ein kurzes Wort). Weil der Verlauf jedes Mal mitgeht, wird jede weitere Nachricht teurer;
    die Anzeige von Tokens und Kosten pro Antwort und für die ganze Sitzung macht das sichtbar.
    Das Modul ist die Grundlage für alle weiteren, denn es nutzt den gemeinsamen LLM-Client aus
    core/llm.py.
  oberflaeche: |
    Oberfläche auf Englisch, drei Spalten im Verhältnis 1:2:1:

    - **Links (Settings):** Optionsfelder „Model“, nach Preis sortiert, mit dem Preis unter jedem
      Modell, Textfeld „System prompt“, Regler „Temperature“ (0 bis 1,5; steuert, wie zufällig
      die Antworten ausfallen); zu jeder Einstellung ein kurzer Hilfetext
    - **Mitte:** der einzige Bereich, der scrollt; Fragen als gefüllte, rechts eingerückte Box,
      Antworten als reiner Text mit grauer Zeile für Modell, Tokens und Kosten; nach jeder Frage
      und Antwort springt der Verlauf ans Ende, ein runder Pfeil zeigt, wenn weiter unten noch
      etwas kommt; die Eingabezeile „Message the model“ sitzt fest am unteren Bildschirmrand
    - **Rechts (Session):** Kosten in USD, Tokens in (mit Hilfetext, warum sie wachsen), Tokens
      out, Tokens total, Anzahl Responses, Button „Clear chat“
  lernziele:
    - "Chat-Completions-API mit den Rollen system, user und assistant: das Grundmuster, auf dem alle weiteren Module aufbauen"
    - "Streaming mit st.write_stream: Antworten wirken schneller, weil die ersten Wörter sofort erscheinen"
    - "Zustandslose API und Kontextfenster: verstehen, warum der Verlauf mitgeschickt wird und die Kosten mit jeder Nachricht steigen"
    - "Tokens und Kosten aus dem usage-Feld auswerten: Kostenbewusstsein von Anfang an"
    - "Session State: den Gesprächsverlauf über die Neuausführungen der Streamlit-Seite hinweg behalten"
  akzeptanz:
    - "Die ersten Wörter einer Antwort sind sichtbar, bevor die Antwort vollständig ist"
    - "Unter jeder Antwort stehen Eingabetokens, Ausgabetokens und Kosten in USD aus dem usage-Feld von OpenRouter"
    - "Die Sitzungskosten entsprechen der Summe der Einzelkosten und stehen nach „Clear chat“ wieder auf 0"
    - "Mit dem System-Prompt „Answer only in German.“ kommt die nächste Antwort auf Deutsch, auch bei englischer Frage"
    - "Fehlt der API-Key, erscheint eine verständliche Fehlermeldung statt eines Tracebacks"
  arbeitsstand: "Chat-Seite läuft lokal, Oberfläche auf Englisch mit drei Spalten: Streaming, System-Prompt, Temperatur, Auswahl aus vier Modellen, Tokens und Kosten pro Antwort und für die Sitzung, verständliche Fehlermeldungen. Alle fünf Akzeptanzkriterien am 18.09.2026 geprüft, 1 bis 4 im Browser mit echtem Key, 5 per AppTest. Am 23.09.2026 Handy-Ansicht repariert: Unter 640 px steht der Verlauf direkt über dem Eingabefeld, Einstellungen und Kennzahlen darüber. Nach Projektregel fehlt nur noch das Deployment."
  naechster_schritt: "App auf Streamlit Community Cloud deployen (vorher Repo auf GitHub pushen) und den Chat dort einmal ausprobieren."
  notizen: |
    - Entscheidung: Modellauswahl auf vier Modelle begrenzt (MODELS in core/models.py, von allen Modulen genutzt),
      drei günstige und Claude Haiku 4.5 als rund zehnmal teurerer Vergleich.
    - OpenRouter liefert Tokens und Kosten erst im letzten Stück des Streams, also erst nach
      st.write_stream auslesen (StreamResponse.usage in core/llm.py).
    - Das Login gilt pro Browser-Sitzung: Neuladen der Seite meldet ab. Lokal schaltet
      SKIP_LOGIN=true in .env die Passwortabfrage ab.
    - Streamlit-Tutorial: https://docs.streamlit.io/develop/tutorials/chat-and-llm-apps/build-conversational-apps
    - Stolperstein CSS: In app_pages/chat.css keine spitze Klammer vor einem Buchstaben, auch nicht
      in Kommentaren. Streamlit prüft eingefügtes HTML mit DOMPurify und verwirft sonst den
      ganzen Style.
    - Stolperstein Skript: Das Scroll-Skript läuft bei jeder Nachricht erneut im selben
      Dokument; Variablen deshalb in einer eigenen Funktion, sonst bricht ein zweites
      „const“ mit „already been declared“ ab.

- id: prompt_labor
  name: Prompt-Labor
  phase: 2
  status: in_arbeit
  kurz: "Dieselbe Aufgabe mit vier Prompt-Techniken nebeneinander, inklusive Kosten und Antwortzeit."
  beschreibung: |
    Ein Prompt ist der Eingabetext, den das Modell bekommt, und schon kleine Änderungen daran
    verändern die Qualität der Antwort deutlich. Das Prompt-Labor schickt dieselbe Aufgabe in
    vier Varianten ab und zeigt die Antworten nebeneinander, damit Unterschiede messbar statt
    gefühlt sind.

    Zero-Shot heißt, die Aufgabe ohne jedes Beispiel zu stellen. Beim Few-Shot-Prompting stehen
    vorher einige gelöste Beispiele im Prompt, sodass das Modell Muster und Antwortformat
    übernimmt. Ein Rollen-Prompt gibt dem Modell eine Persona vor, etwa „You are an experienced
    tax advisor“, was Ton und Fachtiefe beeinflusst. Chain-of-Thought (Schritt für Schritt)
    fordert das Modell auf, seinen Lösungsweg auszuschreiben, bevor es antwortet; das hilft bei
    Rechen- und Logikaufgaben, kostet aber mehr Ausgabetokens.

    Zu jeder Variante zeigt die Seite Tokens, Kosten und Antwortzeit, damit klar wird, wann sich
    eine aufwendigere Technik lohnt.
  oberflaeche: |
    Oberfläche auf Englisch, drei Spalten im Verhältnis 1:2:1:

    - **Links (Settings):** Aufgabe („Word problem“, „Email triage“, „Incident summary“),
      Techniken als Mehrfachauswahl, Modell nach Preis sortiert
    - **Mitte:** Anweisung der Aufgabe, änderbarer Eingabetext „Input“, bei eindeutigen Aufgaben
      die „Reference answer“, Button „Compare“; darunter eine Karte pro Technik (zwei pro Zeile)
      mit Antwort, Tokens, Kosten und Antwortzeit, ganz unten „Prompts sent“ mit einem Reiter
      pro Technik
    - **Rechts (Last run):** Kosten, Tokens in/out/total und Dauer des ganzen Laufs
    - Temperatur fest auf 0, damit Unterschiede vom Prompt kommen und nicht vom Zufall
  lernziele:
    - "Zero-Shot und Few-Shot: erkennen, wann Beispiele im Prompt die Qualität oder das Format verbessern"
    - "Chain-of-Thought: bessere Ergebnisse bei Logikaufgaben gegen höhere Kosten und längere Antwortzeit abwägen"
    - "Rollen und System-Prompts gezielt einsetzen, um Ton und Fachtiefe zu steuern"
    - "Prompts als Vorlagen im Code (core/) ablegen: wiederverwendbar, versioniert und ohne API testbar"
    - "Messen statt raten: Varianten über Tokens, Kosten und Zeit vergleichbar machen"
  akzeptanz:
    - "Eine Aufgabe läuft mit allen vier Techniken und demselben Modell, die Antworten stehen nebeneinander"
    - "Zu jeder Variante ist der vollständige gesendete Prompt einsehbar"
    - "Jede Variante zeigt Eingabetokens, Ausgabetokens, Kosten in USD und Antwortzeit in Sekunden"
    - "Mindestens drei vorbereitete Beispielaufgaben sind auswählbar"
    - "Ein Test ohne API-Aufruf prüft, dass der Few-Shot-Prompt alle Beispiele und der Chain-of-Thought-Prompt die Schritt-für-Schritt-Anweisung enthält"
  arbeitsstand: "Seite läuft lokal: drei Beispielaufgaben, vier Techniken parallel, Karten mit Tokens, Kosten und Zeit, gesendete Prompts als Reiter. Alle fünf Akzeptanzkriterien am 21.09.2026 geprüft (1 bis 3 im Browser mit echtem Key, 4 und 5 per Test). Am 23.09.2026 alle drei Aufgaben mit gpt-4.1-nano und claude-haiku-4.5 verglichen, Ergebnis in den Notizen. Nach Projektregel fehlt nur noch das Deployment."
  naechster_schritt: "App auf Streamlit Community Cloud deployen (vorher Repo auf GitHub pushen) und das Prompt-Labor dort einmal ausprobieren."
  notizen: |
    - Vorlagen und Beispielaufgaben liegen in core/prompt_lab.py (TASKS), die Tests in
      tests/test_prompt_lab.py.
    - Heutige Modelle rechnen oft ungefragt Schritt für Schritt. Die Rechenaufgabe verlangt
      deshalb „nur den Betrag“, sonst sieht man keinen Unterschied zu Chain-of-thought.
    - Lauf am 21.09.2026 mit gemini-2.5-flash-lite: Zero-shot 23.10 und Few-shot 13.10 (falsch,
      je 6 Ausgabetokens), Role und Chain-of-thought 14.03 (richtig, rund 400 Ausgabetokens).
    - Direkt an der API: gpt-4.1-nano lag auch mit Chain-of-thought falsch (21.07),
      mistral-small ignorierte „nur den Betrag“ und rechnete trotzdem.
    - Email triage: Die Mail enthält zwei Probleme, deshalb „eine Zeile pro Problem“ und die
      Regel, dass High nur bei Blockade oder Frist gilt. Erwartet: Billing Medium, Technical High.
    - Lauf am 23.09.2026: Few-shot trifft die Referenz genau (mit claude-haiku-4.5 und
      gpt-4.1-nano), weil ein Beispiel dieselbe Abwägung vormacht. Zero-shot und Role erkennen
      beide Probleme, halten aber das Format nicht ein („Billing: Duplicate charge“) und geben
      beidem High. Chain-of-thought kommt auf Medium und High, schreibt aber eine lange
      Begründung. Mit gemini-2.5-flash-lite schafft nur Chain-of-thought die Prioritäten.
    - Vergleich am 23.09.2026, alle drei Aufgaben mit gpt-4.1-nano und claude-haiku-4.5 über
      die Oberfläche (Temperatur 0), rund 0.009 USD für alle sechs Läufe:
      - Word problem: Chain-of-thought gewinnt, beide Modelle 14.03. Jede Antwort, die sich an
        „nur den Betrag“ hält, ist falsch (nano 4.55, haiku 18.60 und 13.68). haiku mit Role
        trifft nur, weil es die Anweisung ignoriert und doch rechnet. nano lag diesmal mit
        Chain-of-thought richtig (am 21.09. direkt an der API noch 21.07, jetzt mit Role).
      - Email triage: Few-shot gewinnt, bei beiden Modellen genau die Referenz. Zero-shot und
        Role geben beidem High und halten das Format nicht ein. Chain-of-thought: nano gibt
        beidem High; haiku findet die richtigen Prioritäten, kopiert aber den Platzhalter aus
        der Formatvorgabe wörtlich („Billing: X | Priority: Medium“). Bewusst so gelassen, weil
        genau solche Fehler beim Vergleich herauskommen sollen.
      - Incident summary (ohne Referenz, eigene Einschätzung): Few-shot gewinnt, zwei knappe
        Sätze im Ton der Beispiele; nano benutzt dabei aber „TLS“ und schreibt „A expired“.
        haiku setzt bei Zero-shot und Role eine Überschrift davor, Role lässt die
        Folgemaßnahmen weg. Chain-of-thought bringt hier nichts: lange Begründung und zu lange
        Endsätze, bei nano mit Fachbegriffen wie „load balancer“.
      - Fazit: Rechenaufgaben brauchen Chain-of-thought, Format- und Abwägungsaufgaben
        Few-shot. Role allein hilft kaum. haiku kostet pro Lauf 7- bis 17-mal so viel wie nano
        und ist nur beim Word problem öfter richtig.
    - Few-shot braucht rund viermal so viele Eingabetokens wie Zero-shot.

- id: datenextraktion
  name: Datenextraktion
  phase: 2
  status: in_arbeit
  kurz: "Macht aus Freitext wie Rechnungen oder E-Mails geprüfte, strukturierte Daten im JSON-Format."
  beschreibung: |
    Viele Informationen stecken in Freitext, etwa in E-Mails, Rechnungen oder Stellenanzeigen,
    Programme brauchen aber feste Felder wie Betrag, Datum oder Firma. Dieses Modul lässt das
    Modell solche Texte in JSON umwandeln, ein maschinenlesbares Format aus Feldnamen und Werten.

    Das Problem: Modelle liefern Text, und der passt nicht immer zum gewünschten Format oder
    enthält erfundene Werte (Halluzinationen, also plausibel klingende, aber falsche Angaben).
    Deshalb wird das Zielformat als Pydantic-Modell beschrieben, einer Python-Klasse, die Felder
    mit Typen festlegt und eingehende Daten prüft. Über Structured Outputs, eine Funktion der
    API, bei der das Modell ein vorgegebenes JSON-Schema einhalten muss, wird das Format
    erzwungen.

    Besteht die Antwort die Prüfung trotzdem nicht, bekommt das Modell die Fehlermeldung zurück
    und darf bis zu zweimal korrigieren. Angaben, die im Text fehlen, sollen leer bleiben, statt
    geraten zu werden.
  oberflaeche: |
    Oberfläche auf Englisch, drei Spalten im Verhältnis 1:2:1:

    - **Links (Settings):** Dokumenttyp „Invoice“, „Job posting“ oder „Meeting request“, Modell
      nach Preis sortiert
    - **Mitte:** das Schema des Typs als aufklappbare Übersicht (Feld, Typ, Beschreibung),
      Textfeld „Input“ mit Beispieltext, Button „Extract“; darunter das geprüfte Ergebnis als
      Tabelle Feld/Wert und als JSON (`st.json`), untereinander, weil nebeneinander in der
      mittleren Spalte Werte abgeschnitten wurden; ganz unten „Attempts“ mit jeder rohen
      Antwort und der Meldung der Prüfung
    - **Rechts (Last run):** Anzahl der Versuche, Kosten, Tokens in/out/total
    - Scheitert auch die letzte Korrektur, steht statt des Ergebnisses eine Fehlermeldung da
  lernziele:
    - "Pydantic-Modelle als einzige Quelle für Schema, Prüfung und Dokumentation der Felder"
    - "Structured Outputs mit JSON-Schema: verlässlich maschinenlesbare Antworten statt Freitext"
    - "Validierung mit Wiederholung: robuste Abläufe, die fehlerhafte Modellantworten abfangen"
    - "Fehlende Angaben als leer (null) kennzeichnen statt raten lassen: Halluzinationen eindämmen"
    - "Formfehler des Modells zur Korrektur zurückgeben, Widersprüche im Dokument nur als Hinweis melden: sonst macht das Modell Werte passend"
  akzeptanz:
    - "Für alle drei Beispieltexte besteht das Ergebnis die Pydantic-Prüfung"
    - "Ein Feld, das im Text nicht vorkommt, ist null (Beispiel: Rechnung ohne Steuernummer ergibt tax_id: null)"
    - "Beträge sind Zahlen, Datumsangaben haben das Format JJJJ-MM-TT"
    - "Nach höchstens zwei erfolglosen Korrekturversuchen erscheint eine klare Fehlermeldung statt eines Tracebacks"
    - "Ein Test ohne API-Aufruf prüft die Validierung mit einem gespeicherten fehlerhaften JSON"
  arbeitsstand: "Seite läuft lokal: drei Dokumenttypen (Rechnung, Stellenanzeige, Terminanfrage) als Pydantic-Modelle in core/extraction.py, Structured Outputs im Strict Mode, bis zu zwei Korrekturen mit Fehlermeldung, Ergebnis als Tabelle und JSON, alle Versuche einsehbar. Widersprüche im Dokument (Summe, Gehaltsspanne) erscheinen als Hinweis ohne Korrekturversuch. Am 23.09.2026 alle drei Beispieltexte mit allen vier Modellen geprüft (jeweils im ersten Versuch bestanden), Akzeptanzkriterien 1 bis 3 im Browser mit echtem Key, 4 und 5 per Test (20 Tests ohne API). Nach Projektregel fehlt nur noch das Deployment."
  naechster_schritt: "App auf Streamlit Community Cloud deployen (vorher Repo auf GitHub pushen) und die Datenextraktion dort einmal ausprobieren."
  notizen: |
    - Nicht jedes Modell unterstützt Structured Outputs:
      https://openrouter.ai/docs/features/structured-outputs
    - Anfragen schicken provider.require_parameters mit, sonst darf OpenRouter an einen
      Anbieter weiterleiten, der das Schema stillschweigend ignoriert.
    - Uhrzeit nicht als Format "time": gpt-4.1-nano erfand dann eine Zeitzone
      („14:30:00-04:00“), gemini hängte „Z“ an. Jetzt Text mit Muster HH:MM.
    - Die Eingabetokens enthalten das Schema offenbar nicht (Rechnung: 242 Tokens bei
      gemini-2.5-flash-lite, das Schema allein wäre länger).
    - Wichtiger Fund am 23.09.2026: Rechnung mit falschem Gesamtbetrag (3,500.00 statt
      3,474.80). Versuch 1 übernimmt den Text korrekt und scheitert an der Summenprüfung,
      Versuch 2 „korrigiert“ total_amount auf 3474.8, obwohl das nirgends steht. Die
      Korrekturschleife verleitet das Modell also dazu, Daten passend zu machen. Prüfungen,
      die Fehler im Dokument selbst finden (Summen), gehören deshalb nicht in die
      Wiederholung, sondern als Warnung an den Menschen.
    - Entscheidung daraus: Pydantic prüft nur die Form (Typ, Format, Pflichtfelder), das
      Modell darf dann korrigieren. Inhaltliche Widersprüche prüft warnings() am jeweiligen
      Schema; die Seite zeigt sie als st.warning, der Wert bleibt wie im Text. Nach dem Umbau
      liefert dieselbe Rechnung 3500.00 mit Hinweis, in einem Versuch.

# ---------------------------------------------------------------- Phase 3: Kernmodule

- id: rag_chatbot
  name: RAG-Chatbot
  phase: 3
  status: in_arbeit
  kurz: "Beantwortet Fragen zu eigenen PDF-Dokumenten und nennt dabei Datei und Seite als Quelle."
  beschreibung: |
    Ein Sprachmodell kennt die eigenen Dokumente nicht, und ganze PDFs in jede Anfrage zu packen,
    ist teuer und scheitert am Kontextfenster (der maximalen Textmenge pro Anfrage). RAG
    (Retrieval-Augmented Generation, Antworten auf Basis vorher nachgeschlagener Textstellen)
    löst das: Die App sucht zuerst die passenden Stellen und gibt nur diese an das Modell weiter.

    Dafür wird das hochgeladene PDF beim Chunking in kurze, leicht überlappende Abschnitte
    zerlegt. Jeder Abschnitt wird in ein Embedding umgerechnet, eine Zahlenreihe, die die
    Bedeutung des Textes abbildet, sodass inhaltlich ähnliche Texte ähnliche Zahlen haben. Die
    Embeddings liegen in Chroma, einer Vektordatenbank, die zu einer Frage schnell die
    ähnlichsten Abschnitte findet (semantische Suche statt Stichwortsuche).

    Das Modell antwortet nur aus diesen Abschnitten und nennt Datei und Seitenzahl als Quelle.
    Steht die Antwort nicht im Dokument, soll es das sagen, statt etwas zu erfinden.
  oberflaeche: |
    - **Links (Settings):** Upload für eine oder mehrere PDFs (`st.file_uploader`) mit der
      Rückmeldung „X pages read, Y chunks stored“, Regler für Abschnittsgröße, Überlappung und
      Anzahl der Treffer pro Frage (Standard 6), Schalter „Cut at sentences and headings“ zum Vergleich mit
      Schnitten an der nächsten Wortgrenze
    - **Links (Answers):** Modellauswahl nach Preis, „View chunks“ öffnet die Abschnitte als
      Dialog, „Create embeddings“ indexiert vorab (sonst geschieht das mit der ersten Frage)
    - **Mitte:** Chat mit Antworten und Quellenangabe im Format „file, p. X“
    - **Nachvollziehbarkeit:** aufklappbarer Bereich „Retrieved passages“ mit den genutzten
      Abschnitten und ihrem Ähnlichkeitswert
    - **Rechts (Session):** Kosten und Tokens
  lernziele:
    - "RAG-Ablauf in zwei Phasen (Indexieren und Abfragen): eigene Daten nutzen, ohne ein Modell neu zu trainieren"
    - "Chunking-Parameter bewusst wählen: Abschnittsgröße und Überlappung entscheiden über die Trefferqualität"
    - "Embeddings und Vektorsuche mit Chroma: Inhalte nach Bedeutung finden statt nach exakten Wörtern"
    - "Metadaten wie Dateiname und Seite an jeden Abschnitt hängen: Antworten werden nachprüfbar"
    - "Das Modell auf die Quellen begrenzen und „steht nicht im Dokument“ zulassen: weniger Halluzinationen"
  akzeptanz:
    - "Die Antwort nennt Dateiname und Seitenzahl jeder genutzten Quelle"
    - "Eine Frage, deren Antwort nicht im PDF steht, wird mit einem Hinweis wie „The document does not cover this“ beantwortet"
    - "Die für eine Antwort genutzten Textstellen sind in der Oberfläche aufklappbar sichtbar"
    - "Dieselbe Datei zweimal hochzuladen, erzeugt keine doppelten Abschnitte in Chroma"
    - "Ein Test ohne API-Aufruf prüft die Chunking-Funktion (Abschnittsgröße und Überlappung stimmen)"
  arbeitsstand: "Lokal fertig, nur das Deployment fehlt (Projektregel). PDFs einlesen, säubern und an Sätzen und Überschriften zerlegen, jeder Abschnitt mit Überschriften-Pfad; Embeddings in Chroma (im Speicher, eigene Sammlung pro Sitzung); Chat, der nur aus den 6 ähnlichsten Abschnitten antwortet, Quellen als „file, p. X“ nennt und die Abschnitte unter „Retrieved passages“ zeigt. Fragenkatalog mit 10 Fragen in eval/rag_questions.yaml, Auswertung mit python -m core.rag_eval: am 06.10.2026 10 von 10 richtig (gemini-2.5-flash-lite). Alle fünf Akzeptanzkriterien lokal erfüllt, 46 Tests ohne API."
  naechster_schritt: "App auf Streamlit Community Cloud deployen (vorher Repo auf GitHub pushen) und den RAG-Chatbot dort mit den Beispiel-PDFs einmal ausprobieren."
  notizen: |
    - Chroma-Doku: https://docs.trychroma.com
    - Entscheidungen am 23.09.2026 (mit Enno besprochen):
      - Embeddings über OpenRouter (https://openrouter.ai/docs/api-reference/embeddings), nicht
        lokal: derselbe Key, Kosten sichtbar wie überall. Test: text-embedding-3-small liefert
        1536 Zahlen, drei Sätze kosteten 0.00000074 USD.
      - Chroma nur im Speicher und pro Sitzung: Auf Streamlit Cloud geht die Festplatte beim
        Neustart verloren, und eine gemeinsame Sammlung würde fremden Besuchern die eigenen
        Uploads zeigen. Beispiel-PDFs liegen im Repo und werden per Button geladen.
      - Bewusste Abweichung vom Projektplan: Das Modul wird begonnen, obwohl Chat,
        Prompt-Labor und Datenextraktion noch nicht deployed sind.
    - Beispiel-PDFs (öffentlich zugängliche Dokumente der Bayerischen Staatsregierung, von
      Enno geliefert): LEP Bayern 2013 (86 Seiten), LEP Anhang 1 Zentrale Orte 2018 (4),
      Gemeinsame Hinweise Vorrang-/Vorbehaltsgebiete Landwirtschaft 2025 (5). Der
      Raumordnungsbericht 2013–17 wurde als zu groß weggelassen. Die Dokumente sind
      unterschiedlich alt (LEP 2013, Hinweise beziehen sich auf die Fortschreibung 2023):
      guter Test, ob Antworten veraltete Stände erkennen lassen.
    - Ähnlichkeitswerte sind nur innerhalb eines Embedding-Modells vergleichbar: Frage „Strafe
      bei verspäteter Zahlung“ zu „Säumniszuschlag: 1 % pro Monat“ ergab 0.455 bei
      text-embedding-3-small und 0.803 bei gemini-embedding-001 (ein Satz über eine Katze:
      0.148 bzw. 0.510). Also keine festen Grenzwerte, nur die Reihenfolge zählt.
    - Säubern: Die Kopfzeile des LEP steht auf 83 von 86 Seiten; Zeilen, die auf mindestens
      der Hälfte der Seiten stehen, fliegen raus. Silbentrennung („Bewäs-“ + „serung“) wird nur
      vor Kleinbuchstaben zusammengezogen, damit „Obst- und“ erhalten bleibt.
    - Nicht lösbar mit pypdf: auseinandergerissene Wörter („Zusti mmung“, „G esetzes“), der
      Zeichenabstand im PDF ist so. Der Layout-Modus behebt nur einen Teil. Ob es die Suche
      stört, zeigt Schritt 2.
    - Seitenangabe ist die PDF-Seite, nicht die gedruckte Zahl (im LEP steht auf PDF-Seite 4
      die gedruckte 1), weil man im PDF-Viewer dorthin springt.
    - Enno schlug vor, jedem Abschnitt die Startseite zu geben. Problem: 94 von 359
      Abschnitten (800 Zeichen, 150 Überlappung) laufen über eine Seitengrenze, die Antwort
      kann dann auf der Folgeseite stehen. Deshalb Start- und Endseite, angezeigt als
      „p. 3–4“. Dafür werden alle Seiten zu einem Text verbunden und die Startposition jeder
      Seite gemerkt.
    - Messung am 05.10.2026 mit den drei Beispiel-PDFs (800 Zeichen, 150 Überlappung): 359
      Abschnitte, 78685 Tokens, 0.001574 USD, 6.2 Sekunden. Eine Frage kostet rund 10 Tokens,
      also etwa 0.0000002 USD.
    - Trefferwerte am 05.10.2026 (text-embedding-3-small): „Was sind Vorranggebiete für
      Landwirtschaft?“ 0.78 (alle vier Treffer aus dem richtigen Dokument), „Welche Orte sind
      Oberzentren?“ 0.62, dieselbe Frage auf Englisch nur 0.51. Eine Frage, die nicht in den
      Dokumenten steht („Hundesteuer in München“), liefert trotzdem vier Treffer mit 0.41 bis
      0.42. Die Suche gibt also immer etwas zurück; „steht nicht im Dokument“ muss in Schritt 3
      das Modell erkennen, nicht ein Grenzwert.
    - Chroma: Alle EphemeralClients eines Prozesses teilen sich den Speicher, auf Streamlit
      Cloud also alle Besucher. Deshalb bekommt jede Sitzung eine Sammlung mit zufälligem
      Namen. Offen: Sammlungen von Sitzungen, die einfach geschlossen werden, bleiben bis zum
      Neustart im Speicher (nur „Clear documents“ räumt auf).
    - Antworttest am 05.10.2026, vier Fragen an alle vier Modelle (4 Treffer, Temperatur 0.2),
      zusammen 0.011 USD. Eine Antwort kostet 0.0001 bis 0.0002 USD, mit claude-haiku-4.5
      0.0015 bis 0.003 USD; die Abschnitte machen rund 1000 der Eingabetokens aus.
      - „Hundesteuer in München“: Im ersten Prompt hieß es „antworte in der Sprache der
        Frage“, gpt-4.1-nano schrieb deshalb eine deutsche Umschreibung statt des festen
        Satzes. Seit der Prompt den englischen Satz ausdrücklich verlangt, antworten alle
        vier mit „The documents do not cover this.“
      - „Ist München ein Oberzentrum?“: gpt-4.1-nano antwortete „Ja“ mit Quelle (Anhang 1,
        p. 3). Falsch: München steht dort nicht, die Stelle mit Münchens Einstufung war
        nicht unter den Treffern. gemini-2.5-flash-lite sagte korrekt, dass es nicht drinsteht.
      - Vorranggebiete: gemini-2.5-flash-lite gab die Definition dreimal gleich falsch wieder.
        Der beste Treffer beginnt mitten im Satz („Landwirtschaft kommen zum einen Gebiete in
        Frage, deren …“), das Subjekt fehlt.
      - gpt-4.1-nano ließ bei längeren Antworten die Quellen weg, claude-haiku-4.5 setzte
        Markdown-Überschriften, bis der Prompt „no headings“ verlangte.
      - Einmal lieferte OpenRouter für gemini-2.5-flash-lite keine usage (0 Tokens, 0 USD),
        bei drei Wiederholungen nicht mehr. Die Kosten können also gelegentlich fehlen.
    - Chunking nach Struktur am 06.10.2026 (800 Zeichen, 150 Überlappung, drei Beispiel-PDFs):
      Abschnitte an einem Satzanfang vorher 11 von 359, jetzt 340 von 369. Die Überlappung
      schwankt jetzt (Median 163, höchstens 298 Zeichen), weil der nächste Abschnitt am
      Satzanfang beginnt, der 150 Zeichen vor dem Ende am nächsten liegt. Embeddings mit
      Überschriften-Kopf: 0.00193 USD statt 0.00157 USD.
      - Rang des Abschnitts mit der Oberzentren-Liste (Anhang 1, p. 3) unter 4 Treffern:
        „Welche Städte sind Oberzentren?“ vorher nicht dabei, jetzt Platz 3; englische Frage
        vorher Platz 3, jetzt 1; „Ist Rosenheim ein Oberzentrum?“ vorher 2, jetzt 1.
      - Antworten mit gemini-2.5-flash-lite: Beide Oberzentren-Fragen liefern jetzt die Liste
        mit Quelle (vorher „The documents do not cover this.“), Rosenheim richtig. Die Liste
        ist aber unvollständig (Schwaben fehlt, steht im nächsten Abschnitt), ohne Hinweis
        darauf. Vorranggebiete: Der Abschnitt nennt das Subjekt jetzt („Für die Festlegung von
        Vorbehaltsgebieten …“), das Modell ordnet den Satz trotzdem den Vorranggebieten zu.
      - Zwischenstand: Ohne Rückverweise („Zu 2.1.5 (B)“) bekam die ganze Begründung im LEP
        die letzte Ziel-Überschrift „2.1.8 Oberzentren“; die deutsche Oberzentren-Frage fand
        dann vier falsch beschriftete Begründungsabschnitte statt der Liste.
    - Schalter „Cut at sentences and headings“ am 06.10.2026 (800/150, Beispiel-PDFs): an
      369 Abschnitte, Länge 600 bis 799 (Median 728), 340 beginnen am Satzanfang; aus 321
      Abschnitte, fast alle 790 bis 799 Zeichen, 11 am Satzanfang. Die Chunk-Größe ist in
      beiden Fällen eine Obergrenze; an sucht im letzten Viertel (600 bis 800) eine gute
      Schnittstelle.
    - Deutsch gegen Englisch am 06.10.2026 (Rang des richtigen Abschnitts unter 10 Treffern):
      „Welche Städte sind Oberzentren?“ 3, „Which towns are regional centres?“ 6, „Which
      municipalities are designated as Oberzentren?“ 1, „Welche Gemeinden sind als
      Oberzentren festgelegt?“ 5; Rosenheim 1/1, Vorranggebiete-Kriterien 3/4, Windkraft 3/2.
      Englisch ist also nicht allgemein besser; die erste englische Frage enthielt den
      Fachbegriff „Oberzentren“. Ähnlichkeitswerte englischer Fragen liegen durchweg
      niedriger (0.46 bis 0.67 gegen 0.62 bis 0.80), nur die Reihenfolge zählt.
    - Fragenkatalog am 06.10.2026 (eval/rag_questions.yaml, 10 Fragen, davon 2 ohne Antwort
      in den Dokumenten; Ergebnisse in eval/results/). Geprüft wird: richtige Seite unter den
      Treffern (found), erwartete Begriffe in der Antwort (correct), richtige Quelle (cited).
      Mit gemini-2.5-flash-lite, 800/150:
      - Sätze, 4 Treffer: found 7/8, correct 8/10, cited 5/8 (q04, q07 falsch; dreimal gleich)
      - Sätze, 6 Treffer: found 8/8, correct 10/10, cited 7/8 bis 8/8. Deshalb Standard 6.
      - Wortgrenzen, 4 oder 6 Treffer: found 8/8, correct 8/10, cited 7/8. Die Suche findet
        alles, aber die Schwaben-Liste ist unvollständig (dazu „Augsburg ist Oberzentrum“,
        falsch) und München gilt als „not covered“. Mehr Treffer helfen hier nicht.
      - Ein Lauf kostet rund 0.0037 USD, davon 0.0019 USD Embeddings.
      - Modelle mit Sätzen und 6 Treffern: gemini-2.5-flash-lite 10/10 (0.0037 USD),
