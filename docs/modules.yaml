    - Rückfragen („Und in der Oberpfalz?“) funktionierten im Test, weil die Suche nur die neue
      Frage sieht und „Oberpfalz“ zufällig in der richtigen Liste steht. Eine Rückfrage ohne
      eigene Suchbegriffe („Und dort?“) fände nichts Passendes; dafür müsste man die Frage vor
      der Suche umschreiben lassen.

- id: tool_use
  name: Tool Use
  phase: 3
  status: in_arbeit
  kurz: "Das Modell ruft selbst Werkzeuge wie Rechner, Wetterdienst oder Websuche auf, jeder Aufruf ist sichtbar."
  beschreibung: |
    Sprachmodelle rechnen unzuverlässig und kennen keine aktuellen Daten wie das heutige Wetter
    oder die Nachrichten von gestern.
    Function Calling (auch Tool Use) schließt diese Lücke: Die App beschreibt dem Modell
    verfügbare Funktionen mit Name, Zweck und Parametern, und das Modell entscheidet selbst, ob es
    eine davon braucht.

    Statt Text liefert es dann einen strukturierten Aufrufwunsch, etwa „get_weather(city=Hamburg)“;
    ausgeführt wird die Funktion von unserem Code, nicht vom Modell. Das Ergebnis geht zurück an
    das Modell, das daraus die Antwort formuliert, und dieser Kreislauf kann sich mehrmals
    wiederholen.

    Als Werkzeuge dienen ein Rechner, der Formeln sicher auswertet (ohne Pythons eval, das
    beliebigen Code ausführen würde), ein Wetterdienst über die kostenlose Open-Meteo-API, eine
    Websuche, die aktuelle Informationen aus dem Internet samt Links zu den Quellen liefert,
    Datum und Uhrzeit sowie die Dokumentsuche aus dem RAG-Chatbot über die Beispiel-PDFs
    (das Modell entscheidet selbst, wann es in den Dokumenten sucht). Suchergebnisse sind fremder Text und können versteckte Anweisungen
    enthalten (Prompt Injection, siehe Modul Security), deshalb kennzeichnet die App sie im
    Prompt klar als Daten. Jeder Aufruf wird mit Argumenten und Ergebnis angezeigt, damit
    nachvollziehbar ist, was das Modell getan hat.
  oberflaeche: |
    - **Links (Settings):** Schalter, welche Werkzeuge aktiv sind: „Calculator“, „Date &
      time“, „Weather“, „Web search“, „Document search“
    - **Beispielfragen:** Buttons wie „How warm is it in Berlin right now?“, „What is 17 percent
      of 2,340 euros?“ oder „What is the latest Python release?“
    - **Mitte:** Chat mit Eingabezeile und Antworten; Antworten mit Websuche nennen ihre Quellen
      als Links
    - **Schritte:** zu jeder Antwort aufklappbare Schritte mit Werkzeugname, Argumenten (JSON),
      Ergebnis und Dauer
    - **Rechts (Session):** Kosten, Tokens und Anzahl der Werkzeugaufrufe
  lernziele:
    - "Werkzeuge mit JSON-Schema beschreiben: das Modell mit echter Software und aktuellen Daten verbinden"
    - "Die Tool-Schleife (Anfrage, Aufrufwunsch, Ausführung, Antwort) selbst umsetzen und verstehen"
    - "Sichere Ausführung: Argumente prüfen und Modellausgaben nie direkt als Code ausführen"
    - "Externe Dienste (Wetter-API, Websuche) mit Timeout und Fehlerbehandlung anbinden und Suchergebnisse als nicht vertrauenswürdige Daten behandeln"
    - "Transparenz: sichtbare Aufrufe erleichtern die Fehlersuche und schaffen Vertrauen"
  akzeptanz:
    - "„What's the weather in Hamburg?“ löst einen sichtbaren Aufruf des Wetter-Werkzeugs mit dem Argument Hamburg aus, und die Antwort nennt die gelieferte Temperatur"
    - "„What is the latest Python release?“ löst einen sichtbaren Aufruf der Websuche aus, und die Antwort nennt mindestens eine Quelle als anklickbaren Link"
    - "Eine Rechenfrage wird über das Rechner-Werkzeug beantwortet, und das Ergebnis stimmt exakt"
    - "Eine Frage ohne Werkzeugbedarf („Explain photosynthesis“) löst keinen Aufruf aus"
    - "Fällt ein Dienst aus (Wetter-API oder Websuche) oder sind fünf Werkzeug-Runden erreicht, endet der Ablauf mit einer verständlichen Meldung, ohne dass die App abstürzt"
  arbeitsstand: "Lokal fertig, nur das Deployment fehlt (Projektregel). Fünf Werkzeuge (Rechner ohne eval, Datum mit Tagen bis zu einem Datum, Wetter über Open-Meteo, Websuche über ddgs, Dokumentsuche über die RAG-Suche), eigene Tool-Schleife mit höchstens fünf Runden, Schritte live und danach aufklappbar unter jeder Antwort. Alle fünf Akzeptanzkriterien erfüllt (1 bis 4 im Browser, 5 per Test). Fragenkatalog mit 12 Fragen in eval/tool_questions.yaml, Auswertung mit python -m core.tool_eval: am 07.10.2026 claude-haiku-4.5 12/12, mistral-small-3.2 11/12, gemini-2.5-flash-lite 9/12, gpt-4.1-nano 7/12. 36 Tests ohne API und Netz."
  naechster_schritt: "App auf Streamlit Community Cloud deployen (vorher Repo auf GitHub pushen) und prüfen, ob die Websuche über ddgs dort funktioniert oder blockiert wird."
  notizen: |
    - Open-Meteo braucht keinen API-Key: https://open-meteo.com/en/docs
    - Tool Calling bei OpenRouter: https://openrouter.ai/docs/guides/features/tool-calling
    - Nicht jedes Modell unterstützt Tool Calling, vorher auf openrouter.ai/models prüfen.
    - Offen: Websuche selbst bauen (z. B. Bibliothek ddgs für DuckDuckGo ohne API-Key, oder
      Brave Search bzw. Tavily mit kostenlosem Kontingent) oder OpenRouters Server-Tool
      openrouter:web_search nutzen. Das Server-Tool läuft bei OpenRouter statt in unserem Code
      (weniger Lerneffekt bei der Tool-Schleife) und kostet je nach Suchmaschine etwa 0,001 bis
      0,007 USD pro Suche: https://openrouter.ai/docs/guides/features/server-tools/web-search
    - Entschieden am 07.10.2026: ddgs (DuckDuckGo, kein Key, läuft in unserem Code, damit die
      Schleife sichtbar bleibt). Inoffiziell und kann blockiert werden, deshalb Fehler als
      Werkzeugergebnis statt Absturz. Fünftes Werkzeug ist die Dokumentsuche, damit jede Art
      einmal vorkommt: Berechnung, Systemwissen, externe API, Internet, eigene Daten.
    - Tool Calling bei allen vier Modellen laut openrouter.ai/api/v1/models („tools“ und
      „tool_choice“ in supported_parameters), geprüft am 07.10.2026.
    - Messung am 07.10.2026 mit gemini-2.5-flash-lite: Fragen mit einem Werkzeug brauchen zwei
      Runden und kosten 0.00012 bis 0.0002 USD (Eingabe 1300 bis 1800 Tokens), ohne Werkzeug
      0.0001 USD (593 Tokens, davon 379 für die fünf Werkzeugbeschreibungen; ohne angebotene
      Werkzeuge 214). Die Beschreibungen gehen in jeder Runde mit. Die erste
      Dokumentsuche pro Serverprozess kostet zusätzlich 0.0019 USD und rund 7 Sekunden für die
      Embeddings.
    - Fragenkatalog am 07.10.2026 (eval/tool_questions.yaml, 12 Fragen, alle fünf Werkzeuge
      an, je zwei Läufe pro Modell, Ergebnisse in eval/results/tools-*.json). Beide Läufe je
      Modell waren gleich:
      - claude-haiku-4.5: 12/12, rund 0.044 USD pro Lauf. Als einziges Modell nutzt es für die
        Differenz München/Rom den Rechner (drei Aufrufe).
      - mistral-small-3.2: 11/12, 0.0021 USD. Nur t09 (Differenz im Kopf, richtig gerechnet).
        In der Oberfläche nannte es bei Schwaben zusätzlich Augsburg (Metropole); der Katalog
        prüft nur, ob Kempten und Memmingen vorkommen, nicht ob etwas Falsches dabei ist.
      - gemini-2.5-flash-lite: 9/12, 0.0018 USD. t09, dazu Schwaben („Augsburg“) und München
        („Oberzentrum“) falsch, obwohl die Dokumentsuche die richtigen Abschnitte liefert. Im
        RAG-Modul beantwortet dasselbe Modell beide Fragen richtig; dort stehen die Abschnitte
        als Text in der Frage, hier als JSON-Ergebnis eines Werkzeugs.
      - gpt-4.1-nano: 7/12, 0.0020 USD. Antwortet auf englische Fragen auf Deutsch („397,80
        Euro“), Websuche ohne Link, t09, Schwaben falsch.
      - Erster Lauf von gemini einmal mit leerer Antwort nach einem Werkzeugaufruf
        (LLMError „no text“), danach nicht mehr. Die Auswertung zählt das als Fehler statt
        abzubrechen.
      - t12 (Fantasieort) zuerst falsch gestellt: Zwei Modelle fragen bei „Xyzzyqwv“ gar nicht
        erst das Wetter-Werkzeug, sondern antworten gleich. Geprüft wird jetzt nur, dass keine
        Temperatur erfunden wird; alle vier bestehen.
    - Wetter ausgeschaltet, „What's the weather in Hamburg?“: gemini weicht auf die Websuche aus
      und nennt Wetterseiten statt Werten. Das Modell plant mit den Werkzeugen, die es bekommt.
    - Beobachtet am 07.10.2026 (gemini-2.5-flash-lite):
      - „Wie viele Tage bis Heiligabend?“: Das Modell schickte until_date „2024-12-24“, weil es
        das Jahr aus dem Trainingsstand riet, und meldete „-652 Tage“. Seitdem nimmt das
        Werkzeug „12-24“ als nächstes Vorkommen; danach 78 Tage, richtig.
      - „Wärmer in München oder Rom?“: zwei Wetteraufrufe in einer Runde (parallel), die
        Differenz 5.7 rechnete es trotz Regel im Kopf (richtig, 21.4 minus 15.7).
      - Dokumentsuche: Mit dem Beispiel „Oberzentren Schwaben“ in der Werkzeugbeschreibung
        schickte das Modell Stichworte; der richtige Abschnitt landete auf Rang 6 statt 4, und
        die Antwort lautete „keine Oberzentren in Schwaben“. Mit ganzer Frage als Beispiel
        stimmt die Antwort meistens, in einem von zwei Läufen kam trotzdem nur „Augsburg“.

- id: ki_datenanalyst
  name: KI-Datenanalyst
  phase: 3
  status: geplant
  kurz: "Übersetzt Fragen in normaler Sprache in SQL, führt sie nur lesend aus und zeigt Tabelle, Diagramm und Code."
  beschreibung: |
    Viele Fragen an Daten, etwa „Which product category had the highest revenue in 2024?“,
    scheitern daran, dass man SQL beherrschen muss, die Abfragesprache für Datenbanken. Beim
    Text-to-SQL übersetzt das Modell die Frage in eine SQL-Abfrage; dafür bekommt es im Prompt das
    Datenbankschema, also die Liste der Tabellen und Spalten.

    Die Abfrage läuft in DuckDB, einer Analyse-Datenbank, die ohne eigenen Server direkt in
    Python arbeitet. Die Verbindung hat nur Leserechte, sodass selbst eine fehlerhafte oder
    böswillige Abfrage wie DELETE keine Daten verändern kann.

    Das Ergebnis erscheint als Tabelle, als passendes Diagramm und zusammen mit dem erzeugten
    SQL-Code. Der Code ist bewusst sichtbar, denn falsches SQL liefert plausibel aussehende, aber
    falsche Zahlen, und nur so lässt sich das prüfen. Als Datenbasis dient ein öffentlicher oder
    selbst erzeugter Datensatz.
  oberflaeche: |
    - **Datensatz:** aufklappbare Übersicht der Tabellen und Spalten
    - **Frage:** Textfeld plus Buttons mit Beispielfragen
    - **Ergebnis:** erzeugtes SQL (`st.code`), Ergebnistabelle (`st.dataframe`), automatisch
      gewähltes Diagramm (Balken oder Linie) und ein Satz Zusammenfassung
    - **Fehlerfall:** Meldung zum SQL-Fehler und Anzeige des Korrekturversuchs
  lernziele:
    - "Text-to-SQL mit dem Schema im Prompt: Datenanalyse ohne SQL-Kenntnisse ermöglichen"
    - "Schutzmaßnahmen (Verbindung nur lesend, nur SELECT erlaubt): KI-Ausgaben nie mit vollen Rechten ausführen"
    - "Fehlerschleife: SQL-Fehlermeldungen an das Modell zurückgeben und korrigieren lassen"
    - "Ergebnisse automatisch als passendes Diagramm darstellen"
    - "Nachvollziehbarkeit durch sichtbaren Code: Ergebnisse prüfbar machen"
  akzeptanz:
    - "Zu jeder Frage erscheinen erzeugtes SQL, Ergebnistabelle und Diagramm"
    - "Ein Test ohne API-Aufruf zeigt, dass DROP-, DELETE- und UPDATE-Anweisungen abgelehnt werden und die Daten unverändert bleiben"
    - "Fünf vorbereitete Beispielfragen liefern dieselben Ergebnisse wie von Hand geschriebenes SQL"
    - "Bei einem SQL-Fehler gibt es höchstens einen automatischen Korrekturversuch, danach eine verständliche Meldung"
    - "Herkunft und Lizenz des Datensatzes sind im Repo dokumentiert"
  arbeitsstand: "noch nicht begonnen"
  naechster_schritt: "noch nicht begonnen"
  notizen: |
    - Offen: welcher Datensatz? Idee: Verkaufsdaten per Skript selbst erzeugen, dann gibt es
      keine Lizenzfragen.
    - DuckDB-Doku: https://duckdb.org/docs/

# ---------------------------------------------------------------- Phase 4: Fortgeschritten

- id: workflow_freigabe
  name: Workflow mit Freigabe
  phase: 4
  status: geplant
  kurz: "Eingehende Mails werden klassifiziert und beantwortet, ein Mensch gibt jeden Entwurf frei, alles wird protokolliert."
  beschreibung: |
    Das Modul bildet einen typischen Arbeitsablauf aus Unternehmen nach: Eingehende Kundenmails
    werden vom Modell klassifiziert, also einer Kategorie und Dringlichkeit zugeordnet, und
    anschließend beantwortet es sie im Entwurf.

    Nichts geht ungeprüft raus, denn es gilt Human-in-the-Loop: Ein Mensch prüft jeden Entwurf
    und entscheidet, ob er ihn freigibt, bearbeitet oder verwirft. So verbindet der Ablauf die
    Geschwindigkeit der KI mit menschlicher Kontrolle und verhindert, dass fehlerhafte Antworten
    direkt beim Kunden landen.

    Jede Mail durchläuft feste Zustände: neu, klassifiziert, Entwurf, freigegeben oder verworfen.
    Jede Entscheidung landet in einem Audit-Log, einem Protokoll mit Zeitpunkt, Entwurf,
    Entscheidung und Änderungen. Daraus lässt sich die Freigabequote berechnen, also wie oft
    Entwürfe unverändert übernommen werden, als einfaches Maß für die Qualität. Die Beispielmails
    sind selbst geschrieben.
  oberflaeche: |
    - **Posteingang:** Liste der Beispielmails mit Kategorie, Priorität und Zustand
    - **Detail:** ausgewählte Mail im Original, Klassifikation mit kurzer Begründung, Entwurf in
      einem bearbeitbaren Textfeld
    - **Entscheidung:** Buttons „Approve“, „Approve edited“ und „Discard“
    - **Protokoll:** Tabelle aller Entscheidungen mit Zeitstempel, darüber die Freigabequote als
      Kennzahl
  lernziele:
    - "Mehrstufige LLM-Abläufe (erst klassifizieren, dann entwerfen) mit strukturierter Ausgabe bauen"
    - "Human-in-the-Loop: Die KI schlägt vor, der Mensch entscheidet, wichtig für Haftung und Vertrauen"
    - "Zustände sauber modellieren, damit keine Mail doppelt oder gar nicht bearbeitet wird"
    - "Audit-Log und Kennzahlen: Entscheidungen nachvollziehbar und Qualität messbar machen"
  akzeptanz:
